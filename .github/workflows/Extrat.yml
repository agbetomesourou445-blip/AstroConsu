name: Extract AstroConsu ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o astroconsu-v17-cosmic-pro.zip -d .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Extract AstroConsu v17 project files"
          git push
          
