name: AstroConsu Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astroconsu
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-4o-mini
      AUTH_SECRET: test-auth-secret-012345678901234567890123456789
      FEDAPAY_SECRET_KEY: test-secret
      FEDAPAY_PUBLIC_KEY: test-public
      FEDAPAY_WEBHOOK_SECRET: test-webhook
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_URL: https://wa.me/message/PIQJ7XBLTNLWO1
      NEXT_PUBLIC_TELEGRAM_URL: https://t.me/AstroConsuPR

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astroconsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d astroconsu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build