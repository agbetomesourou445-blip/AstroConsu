name: Extract AstroConsu ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Extract AstroConsu ZIP
        run: |
          unzip -o astroconsu-v17.3-buildfix.zip -d extracted

          cp -a extracted/. .

          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f astroconsu-v17.3-buildfix.zip

      - name: Commit AstroConsu V17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement à envoyer."
            exit 0
          fi

          git commit -m "Extract AstroConsu V17"

          git push origin HEAD:main
